name: Build Releases

# 三平台自动打包：在 Windows / macOS / Linux 虚拟机分别用 PyInstaller 打包，
# 产出对应平台的可执行文件并上传到 Release / Artifacts。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 也支持手动触发（仓库页面 Actions -> Run workflow）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BookmarkChecker.exe
            args: --onefile --windowed --name BookmarkChecker --icon icon.ico gui.py
          - os: macos-latest
            artifact: BookmarkChecker.app
            args: --onefile --windowed --name BookmarkChecker --icon icon.ico gui.py
          - os: ubuntu-latest
            artifact: BookmarkChecker
            args: --onefile --windowed --name BookmarkChecker gui.py

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Windows / macOS)
        if: runner.os != 'Linux'
        run: pip install pyinstaller requests pillow

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller requests

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}
